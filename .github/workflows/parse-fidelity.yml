# ABOUTME: Runs the parser fidelity ratchet against perl's own test suite on push and PR.
# ABOUTME: Pins the interpreter and the corpus revision, because a verdict measured across a skew is an anecdote.
#
# HOW THIS GATE IS GUARDED, AND WHAT IT CANNOT GUARD
# --------------------------------------------------
# A GitHub workflow cannot be run locally, so nothing in this file was
# executed on a runner before it was committed. Five rounds of review found
# fourteen ways to make an earlier version of this job go green while
# measuring nothing, and every one of them got past a guard that asked
# whether the YAML text did or did not contain some substring: a second -run
# that Go honours and a field scan does not, -skip, -list, -count=0,
# -exec /bin/true, -parseoracle.corpus=false, GOFLAGS in the step's env, the
# require-corpus switch set to '0', exports inside the script, `| tee` under
# a shell with no pipefail, `|| echo`, `|| true` hidden behind a `#` inside a
# parameter expansion, and a shell without -e. The ways not to run a Go test
# are not enumerable by substring, so this file no longer relies on that.
#
# The gate is two steps, and the second is what makes the first honest:
#
#   * "Run the fidelity ratchet" runs TestRatchetCorpus, which -- only after
#     the ratchet has passed -- writes $PARSEORACLE_RECEIPT: how many files
#     it swept, how many rows the baseline had, the baseline's sha256, the
#     pin, and a digest of the verdicts. A sweep that was skipped, filtered
#     out, listed, run under /bin/true, or never reached writes nothing.
#   * "Verify the sweep's receipt" runs internal/parseoracle/cmd/receipt,
#     which recomputes every field from the checked-out tree: the receipt
#     must exist, its sha256 must be the committed baseline's, its pin must
#     be corpus.pin, its verdict digest must be what the committed rows
#     digest to, files_swept must equal baseline_rows, and baseline_rows
#     must be at least 310. The last is F7: Check is a symmetric diff, so a
#     baseline truncated to its header and a shim with no files agree on
#     nothing and pass. TestRatchetCorpus refuses an empty denominator too.
#
# What is tested locally, in the normal `go test` suite:
#
#   * TestCIGateRunsTheSweep (internal/parseoracle/gate_test.go) does not
#     read the two gate steps; it EXECUTES them, as committed -- the script,
#     the step's shell (absent means `bash -e {0}`, exactly as on GitHub, so
#     no pipefail), and every env: block from the workflow, job and step
#     levels -- over a five-file shim built from the fixture corpus. The
#     sweep step must exit 0 and write a receipt for five files against the
#     baseline it was given; must exit non-zero, and write no receipt, when
#     that baseline records one file differently; and must exit non-zero
#     when the corpus is absent in the shape a cache miss leaves. The receipt
#     step must reject that five-file receipt, reject a missing one, and
#     accept one that describes the committed baseline. Each of the fourteen
#     bypasses above was re-applied to this file against that test and
#     failed it, because none of them yields a five-file receipt together
#     with a failing exit on a regression.
#   * TestCIGateCannotBeAdvisory: no continue-on-error on the job or any
#     step. A GitHub semantic, not a shell one, so it is read, not executed.
#   * TestCIGateCannotBeSkipped: no `if:` on the job or on either gate step,
#     and both triggers name pu. Read, not executed, and partial -- see below.
#   * TestCINeverRebaselines: -parseoracle.update never appears. A must-not-
#     contain check can be hidden from; the executed test above is what
#     fails a step that re-baselines, since it would exit 0 on a regression.
#   * ci_test.go also checks that this file parses, that every step uses a
#     versioned action or runs a command, that the pin is read through
#     .github/scripts/parseoracle-pin.sh (which agrees with ReadPin) rather
#     than hardcoded, that PARSEORACLE_TIMEOUT is set, read, and larger than
#     DefaultTimeout, and that the interpreter check runs BEFORE the sweep
#     and names both versions and the word skew.
#
# WHAT NO TEST IN THIS REPOSITORY CAN CLOSE
#
# `if: false` on the job, `if: false` on a step, or triggers that name some
# other branch each produce a workflow that parses, passes every executable
# check, and never runs. TestCIGateCannotBeSkipped reads those three keys,
# which catches the edit but not the consequence: today the `pu` ruleset has
# deletion, non_fast_forward and pull_request rules and NO required status
# checks (`gh api repos/perigrin/pvm/branches/pu/protection` answers 404,
# "Branch not protected"). So a job that is skipped, deleted, or never
# triggered is indistinguishable, at the merge button, from one that passed.
# The fix is the repository owner's, not this file's: add to the pu ruleset
#
#     required_status_checks: ["Fidelity ratchet (pinned perl + pinned corpus)"]
#
# with strict_required_status_checks_policy enabled, so that a missing check
# blocks the merge instead of counting as success. Until that is applied,
# this workflow reports; it does not gate.
#
# What remains genuinely unproven until this runs on a real runner:
#
#   1. shogo82148/actions-setup-perl@v1 provides 5.42.0 on ubuntu-latest, and
#      the resulting @INC has both a pure-perl and an architecture-specific
#      root. BuildShim REQUIRES both -- libraryRoots() errors on fewer than
#      two -- and a system perl that ships only one would fail the job with a
#      clear message rather than a wrong number, which is the acceptable
#      failure mode.
#   2. The partial clone actually fetches the pinned revision. `--filter=blob:none`
#      plus a later `checkout` backfills blobs on demand; if that is slow or
#      the revision is unreachable by a filtered fetch, this step is where it
#      shows.
#   3. The shim cache round-trips, and is worth having. A shim is ~1.3GB of
#      many small files, which is large for actions/cache; if restoring it is
#      slower than rebuilding it, the cache should be DELETED rather than kept
#      for show. The sweep builds the shim on a miss either way, so removing
#      the two cache steps is a safe follow-up once a real run has timings.
#   4. Whether the raised per-file timeout is enough. It was chosen from a
#      local measurement (see PARSEORACLE_TIMEOUT below), not from a runner.
#   5. The runtime of the whole job. Locally the sweep is ~6 minutes on 24
#      workers -- 11m27s when something else was running alongside it -- and a
#      4-vCPU runner will be slower again. timeout-minutes below is a guess
#      with margin rather than a measurement.
#
# That last cost is avoidable and currently is not avoided. RunOptions.Cache
# serves perl's facts from disk instead of spawning perl, but no sweep passes
# one, so this job spawns perl 620 times on every push. Tracked as 01a095cb,
# "Wire the oracle cache into the corpus sweep"; it is a speedup rather than a
# correctness fix, which is why this ships without it.

name: Parse Fidelity

on:
  # TEMPORARY: manual trigger so a scratch branch can produce a real run; reverted before merge.
  workflow_dispatch:
  push:
    branches: [ pu ]
  pull_request:
    branches: [ pu ]

# A second push supersedes the first: the sweep costs minutes and the only
# answer that matters is the one for the tip.
concurrency:
  group: parse-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchet:
    name: Fidelity ratchet (pinned perl + pinned corpus)
    runs-on: ubuntu-latest
    # Generous, because the sweep is ~6 minutes locally on 24 workers and a
    # shared runner has 4. This bounds the job; PARSEORACLE_TIMEOUT bounds a
    # single file.
    timeout-minutes: 45
    # PARSEORACLE_RECEIPT is set on each of the two gate steps below rather
    # than once here: the `runner` context is not available in a job-level
    # env, and a workflow that names it there does not parse -- GitHub
    # records a 0s failure, "workflow file issue", and runs nothing.

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # The pin is read once, by the script the local suite tests, and every
    # later step uses its outputs. Nothing below may name a version or a
    # revision of its own -- a second copy of the pin is a copy that drifts,
    # and TestCIPinsTheWorldItMeasuresIn fails the build if one appears.
    - name: Read the corpus pin
      id: pin
      run: sh .github/scripts/parseoracle-pin.sh >> "$GITHUB_OUTPUT"

    # ubuntu-latest ships some other perl. Running the sweep against it makes
    # CheckPin report "re-baseline needed" -- correctly, and uselessly.
    # multi-thread: the baseline was measured on a perl built with
    # -Duseithreads (archname x86_64-linux-thread-multi). The action's default
    # is a non-threaded build, and on that perl five corpus files --
    # class/threads.t, op/threads.t, op/threads-dirh.t, re/stclass_threads.t,
    # re/user_prop_race_thr.t -- skip_all_without_config('useithreads') before
    # compiling anything, so they read as `no-answer` where the baseline says
    # `exact`. Run 34794163506 failed on exactly three of them. `$]` does not
    # see this, which is why the step after this one checks useithreads too.
    - name: Install the pinned perl
      id: perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: ${{ steps.pin.outputs.perl_version }}
        multi-thread: true

    - name: Confirm the interpreter matches the pin
      env:
        PINNED: ${{ steps.pin.outputs.interpreter }}
      run: |
        set -eu
        actual=$(perl -e 'print $]')
        echo "this runner has perl $actual; the pin records $PINNED"
        if [ "$actual" != "$PINNED" ]; then
          echo "::error::this runner has perl $actual but the baseline was measured on $PINNED."
          echo "::error::every verdict would be compared across a skew. Fix the perl, do not re-baseline from CI."
          exit 1
        fi
        # corpus.pin does not record the thread configuration; the baseline's
        # threaded perl is an assumption this step makes explicit rather than
        # leaves for the ratchet to report as three unexplained regressions.
        threads=$(perl -MConfig -e 'print $Config{useithreads} || "undef"')
        echo "this runner's perl has useithreads=$threads; the baseline was measured with useithreads=define"
        if [ "$threads" != "define" ]; then
          echo "::error::this runner's perl is built without ithreads but the baseline was measured on one with them."
          echo "::error::the *threads*.t files would skip before compiling and read as regressions. Fix the perl, do not re-baseline from CI."
          exit 1
        fi

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.24.4'

    # ~200MB of blobs is not worth refetching per run, and the tree at a fixed
    # revision never changes, so the revision alone is a complete cache key.
    - name: Restore the pinned perl5 corpus
      id: corpus-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/perl5
        key: perl5-corpus-${{ steps.pin.outputs.revision }}

    - name: Fetch the corpus at the pinned revision
      if: steps.corpus-cache.outputs.cache-hit != 'true'
      env:
        REVISION: ${{ steps.pin.outputs.revision }}
      run: |
        set -eu
        # A partial clone rather than a shallow one: --depth would not let us
        # reach a revision that is not near a branch tip, and the pin is a
        # specific commit rather than a branch.
        git clone --filter=blob:none --no-checkout \
          https://github.com/Perl/perl5 "$RUNNER_TEMP/perl5"
        git -C "$RUNNER_TEMP/perl5" checkout --detach "$REVISION"

    - name: Confirm the corpus is at the pinned revision
      env:
        REVISION: ${{ steps.pin.outputs.revision }}
      run: |
        set -eu
        actual=$(git -C "$RUNNER_TEMP/perl5" rev-parse HEAD)
        if [ "$actual" != "$REVISION" ]; then
          echo "::error::corpus is at $actual but the pin records $REVISION."
          echo "::error::a cached corpus went stale, or the clone did not reach the pinned commit."
          exit 1
        fi

    # BuildShim copies perl's t/ plus every non-site @INC root, which is the
    # only tree perl's own tests compile in: t/test.pl clears @INC and
    # unshifts ../lib. It depends on both halves of the pin -- the corpus
    # supplies t/, the interpreter supplies lib/ -- so both are in the key.
    #
    # There is no separate build step. The sweep builds the shim itself when
    # $PARSEORACLE_SHIM names a directory with no t/test.pl in it, which is
    # exactly what a cache miss leaves behind; actions/cache then saves the
    # built tree in its post step. One code path, exercised locally every time
    # anyone runs the sweep without a prebuilt shim, rather than a
    # CI-only command that nothing else runs.
    #
    # perl-hash is the action's digest of `perl -V`, so a shim copied from a
    # non-threaded perl's @INC is never restored under a threaded one: the
    # .so halves of its XS modules would not load, and the key on version
    # alone cannot tell the two builds apart.
    - name: Restore the shim
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/oracleshim
        key: parseoracle-shim-${{ steps.pin.outputs.interpreter }}-${{ steps.perl.outputs.perl-hash }}-${{ steps.pin.outputs.revision }}

    # The gate, first half. -parseoracle.corpus opts into the 620-file sweep;
    # -parseoracle.update is ABSENT and must stay absent, because a job that
    # rewrites the baseline it is checking against launders every regression
    # into the baseline and can never fail. A re-baseline is a deliberate
    # local act that lands in the same commit as the change that moved it.
    #
    # A pin mismatch surfaces as SkewError -- "re-baseline needed" -- rather
    # than as a list of regressions, so a perl upgrade on the runner does not
    # read as the parser breaking overnight. The two steps above make that
    # case loud earlier, but CheckPin is the backstop.
    #
    # This step is executed, not read, by TestCIGateRunsTheSweep: change its
    # script, shell or env and the test runs the changed version.
    - name: Run the fidelity ratchet
      env:
        PERL5_CORPUS: ${{ runner.temp }}/perl5
        PARSEORACLE_SHIM: ${{ runner.temp }}/oracleshim
        # Written only after the ratchet passes, read by the step after it,
        # which names the same path.
        PARSEORACLE_RECEIPT: ${{ runner.temp }}/ratchet-receipt.json
        # DefaultTimeout is 60s, calibrated on a 24-core machine where
        # op/pack.t -- the most expensive file in the corpus -- costs 37s of
        # CPU unloaded. That is 62% of the budget with no margin for a slower
        # runner, and a file that times out is recorded as a runner error,
        # which moves it out of its baseline bucket and reads as a regression
        # caused by nothing. 8m is ~13x the measured worst case: chosen so
        # that a timeout means a file genuinely wedged (re/pat_psycho.t forks
        # a watchdog and is baselined as `error` for exactly that reason)
        # rather than that the runner was busy.
        PARSEORACLE_TIMEOUT: 8m
        # A missing corpus is a skip locally and a failure here. Every step
        # above tries to put perl5 at $RUNNER_TEMP/perl5, but a restored cache
        # can be empty and a filtered clone can fail in ways that leave a
        # directory behind; the sweep would then find no t/test.pl, skip, and
        # this job would go green having measured zero files. That is the
        # failure this whole workflow exists to prevent, arrived at from the
        # other side. The receipt step below would also fail on the missing
        # receipt; this makes the reason legible in the sweep's own log.
        PARSEORACLE_REQUIRE_CORPUS: '1'
      run: |
        go test ./internal/parseoracle/ \
          -run TestRatchetCorpus \
          -parseoracle.corpus \
          -count=1 \
          -timeout 40m \
          -v

    # The gate, second half. Whatever the step above did, this one asks for
    # the receipt only a completed TestRatchetCorpus writes, and checks it
    # against the checked-out baseline and pin. The paths it compares against
    # are fixed inside the command on purpose.
    - name: Verify the sweep's receipt
      env:
        PARSEORACLE_RECEIPT: ${{ runner.temp }}/ratchet-receipt.json
      run: go run ./internal/parseoracle/cmd/receipt "$PARSEORACLE_RECEIPT"
