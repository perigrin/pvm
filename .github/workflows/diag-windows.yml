# ABOUTME: Temporary diagnostic for PR #493: runs the Windows test step and reports each failing test as an annotation.
# ABOUTME: The cloud session that opened the PR cannot read Actions logs; delete this branch once the failure is known.

name: Diag Windows

on:
  push:
    branches: [ 'diag/m3-windows' ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.24.4'
    - name: Test as CI does (default shell)
      env:
        PVM_REQUIRE_PERL542: "1"
      run: |
        go test ./... -count=1 -v *> test.log
        "exit $LASTEXITCODE" | Out-File -Append test.log
        (Get-Command perl).Source | Out-File perl.txt
    - name: Failing tests
      shell: bash
      run: |
        echo "::error title=perl::$(cat perl.txt | tr -d '\r')"
        echo "::error title=summary::$(grep -aE -- '^(--- FAIL|FAIL|panic:|exit )' test.log | tr -d '\r' | head -60 | awk '{printf "%s%%0A", $0}')"
        for t in $(grep -aE -- '^--- FAIL: ' test.log | tr -d '\r' | awk '{print $3}' | head -8); do
          body=$(awk -v t="$t" '$0 ~ "^=== RUN   "t"\r?$" {on=1} on {print} $0 ~ "^--- (FAIL|PASS): "t" " {exit}' test.log | tr -d '\r' | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=$t::${body:0:5000}"
        done
