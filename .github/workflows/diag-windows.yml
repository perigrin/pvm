# ABOUTME: Temporary diagnostic for PR #493: runs the Windows test step and reports each failing test as an annotation.
# ABOUTME: The cloud session that opened the PR cannot read Actions logs; delete this branch once the failure is known.

name: Diag Windows

on:
  push:
    branches: [ 'diag/m3-windows' ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.24.4'
    - name: Conformance failures, one annotation per test
      shell: bash
      env:
        PVM_REQUIRE_PERL542: "1"
      run: |
        go test ./internal/conformance/ -count=1 -v > conf.log 2>&1 || true
        for t in TestLintRejectsUndeclaredConstruct TestPerlAdjudicatesFirst TestCorpus TestAdjacencyCoversItsTier TestEmptyExpectedOutputIsChecked TestCorpusSkipsAreDocumented; do
          body=$(awk -v t="$t" '$0 ~ "^=== RUN   "t"$" {on=1} on {print} $0 ~ "^--- (FAIL|PASS): "t" " {exit}' conf.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=$t::${body:0:6000}"
        done
        perl -v | head -3 | tr '\n' ' ' | sed 's/^/::error title=perl::/'; echo
        which perl; echo "::error title=which::$(which -a perl | tr '\n' ' ')"
