# ABOUTME: GitHub Actions workflow for building Perl binaries across multiple platforms
# ABOUTME: Uses pvm build-perl --upload command with platform matrix

name: Build Perl Binaries

on:
  # Manual trigger only
  workflow_dispatch:
    inputs:
      perl_versions:
        description: 'Perl versions to build (comma-separated or "latest2" for most recent 2 versions)'
        required: false
        default: 'latest2'
        type: string
      perl_source_url:
        description: 'Optional source tarball URL to build from (e.g. author path for a release not yet on /src/5.0/). Only valid for a single version in perl_versions.'
        required: false
        default: ''
        type: string
      platforms:
        description: 'Comma-separated platforms to build (subset of: linux-amd64,darwin-amd64,darwin-arm64). darwin-amd64 is off by default due to macos-13 runner scarcity; add it explicitly to build it.'
        required: false
        default: 'linux-amd64,darwin-arm64'
        type: string

# Required permissions for GitHub token to create releases and upload assets
permissions:
  contents: write    # Required to create releases and upload assets
  actions: read      # Required to read workflow artifacts (if needed)

jobs:
  # Get latest Perl versions and prepare matrix
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      versions_array: ${{ steps.matrix.outputs.versions_array }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Download latest PVM release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest release tag (including pre-releases)
          # Select the latest pvm release (tag starts with "v"), not the newest
          # release overall — perl-* binary releases published by this workflow
          # would otherwise be picked up as the "latest" and break the download.
          LATEST_TAG=$(gh release list --repo ${{ github.repository }} --json tagName --jq 'map(.tagName | select(startswith("v"))) | .[0]')
          echo "Using release: $LATEST_TAG"

          # Download the linux-amd64 release asset
          echo "Downloading release assets..."
          gh release download "$LATEST_TAG" --repo ${{ github.repository }} --pattern "*linux-amd64.tar.gz"

          # List downloaded files for debugging
          echo "Downloaded files:"
          ls -la *.tar.gz 2>/dev/null || echo "No tar.gz files found"

          # Extract and make executable
          echo "Extracting archive..."
          tar -xzf *-linux-amd64.tar.gz

          # List extracted files for debugging
          echo "Extracted files:"
          ls -la pvm 2>/dev/null || echo "No pvm binary found"

          chmod +x pvm

          # Verify it works
          echo "Testing pvm..."
          ./pvm version

      - name: Get Perl versions
        id: versions
        run: |
          if [[ "${{ github.event.inputs.perl_versions }}" == "latest2" ]]; then
            # Get the 2 most recent stable versions
            VERSIONS=$(./pvm available --format=json | jq -r '[.[] | select(.type == "stable") | .version] | sort_by(.) | reverse | .[0:2] | join(",")')
          else
            VERSIONS="${{ github.event.inputs.perl_versions }}"
          fi
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "Selected Perl versions: $VERSIONS"

      - name: Generate build matrix
        id: matrix
        env:
          # Passed via env (not inline ${{ }}) to avoid shell injection.
          PLATFORMS_INPUT: ${{ github.event.inputs.platforms }}
        run: |
          # Convert comma-separated versions to JSON array
          VERSIONS_JSON=$(echo "${{ steps.versions.outputs.versions }}" | jq -R 'split(",") | map(select(length > 0))')

          # Platform matrix from the dispatch input (defaults to all three).
          # macOS relocation (install_name_tool + codesign) is implemented in
          # internal/perl/relocatable.go alongside the Linux patchelf path.
          PLATFORMS=$(printf '%s' "$PLATFORMS_INPUT" | jq -R 'split(",") | map(select(length > 0))')

          MATRIX=$(jq -n --argjson versions "$VERSIONS_JSON" --argjson platforms "$PLATFORMS" '{
            include: [
              $versions[] as $version | $platforms[] as $platform | {
                version: $version,
                platform: $platform,
                runner: (
                  if $platform == "linux-amd64" then "ubuntu-latest"
                  elif $platform == "darwin-amd64" then "macos-13"
                  elif $platform == "darwin-arm64" then "macos-latest"
                  else error("unknown platform: \($platform) (valid: linux-amd64, darwin-amd64, darwin-arm64)") end
                )
              }
            ]
          }')

          # Output the matrix as a single line for GitHub Actions
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> $GITHUB_OUTPUT
          echo "versions_array=$(echo "$VERSIONS_JSON" | jq -c .)" >> $GITHUB_OUTPUT
          echo "Generated matrix:"
          echo "$MATRIX" | jq .

  # Build binaries using pvm build-perl --upload
  build:
    name: Build ${{ matrix.version }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Install build-time dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # patchelf rewrites DT_RUNPATH on the built Perl ELF binaries so
          # libperl.so resolves via $ORIGIN-relative paths instead of the
          # build host's absolute prefix. Without this, every released
          # binary fails at runtime on users' machines with "libperl.so:
          # cannot open shared object file".
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf

      - name: Download latest PVM release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest release tag (including pre-releases)
          # Select the latest pvm release (tag starts with "v"), not the newest
          # release overall — perl-* binary releases published by this workflow
          # would otherwise be picked up as the "latest" and break the download.
          LATEST_TAG=$(gh release list --repo ${{ github.repository }} --json tagName --jq 'map(.tagName | select(startswith("v"))) | .[0]')
          echo "Using release: $LATEST_TAG"

          # Download the release asset for the current platform
          echo "Downloading release assets..."
          gh release download "$LATEST_TAG" --repo ${{ github.repository }} --pattern "*${{ matrix.platform }}.tar.gz"

          # List downloaded files for debugging
          echo "Downloaded files:"
          ls -la *.tar.gz 2>/dev/null || echo "No tar.gz files found"

          # Extract and make executable
          echo "Extracting archive..."
          tar -xzf *-${{ matrix.platform }}.tar.gz

          # List extracted files for debugging
          echo "Extracted files:"
          ls -la pvm 2>/dev/null || echo "No pvm binary found"

          chmod +x pvm

          # Verify it works
          echo "Testing pvm..."
          ./pvm version

      - name: Build Perl binary (no upload)
        env:
          # Optional source URL for a release not yet mirrored to /src/5.0/.
          # Passed via env (not inline ${{ }}) to avoid shell injection.
          PERL_SOURCE_URL: ${{ github.event.inputs.perl_source_url }}
          MATRIX_VERSION: ${{ matrix.version }}
        run: |
          # The URL override only applies to the matrix version it names, so a
          # multi-version dispatch with a single URL builds the other versions
          # normally instead of pointing them all at the same source.
          if [ -n "$PERL_SOURCE_URL" ] && printf '%s' "$PERL_SOURCE_URL" | grep -qF "perl-$MATRIX_VERSION."; then
            echo "Building version $MATRIX_VERSION from source URL: $PERL_SOURCE_URL"
            ./pvm perl build "$PERL_SOURCE_URL"
            # pvm names the install dir from the version detected in the tarball.
            # Downstream steps (tarball, artifact, release tag) use $MATRIX_VERSION,
            # so refuse to continue if the detected version diverged — otherwise we
            # would publish a binary under the wrong tag.
            if [ ! -x "$HOME/.local/share/pvm/versions/$MATRIX_VERSION/bin/perl" ]; then
              echo "::error::URL build did not produce versions/$MATRIX_VERSION; detected version differs from $MATRIX_VERSION, refusing to publish under the wrong tag" >&2
              exit 1
            fi
          else
            ./pvm perl build "$MATRIX_VERSION"
          fi
        timeout-minutes: 120

      - name: Create binary archive
        run: |
          # Use PVM's native perl tarball command for reliable cross-platform archive creation
          ./pvm perl tarball ${{ matrix.version }} \
            --output ~/.local/share/pvm/versions/${{ matrix.version }}/perl-${{ matrix.version }}-${{ matrix.platform }}.tar.gz \
            --exclude "*.log" --exclude "*.tmp" --exclude ".pvm-*"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: perl-${{ matrix.version }}-${{ matrix.platform }}
          path: ~/.local/share/pvm/versions/${{ matrix.version }}/perl-${{ matrix.version }}-${{ matrix.platform }}.tar.gz
          retention-days: 1

  # Upload job - creates releases with all platform binaries
  upload:
    name: Upload Perl ${{ matrix.version }} Binaries
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: success()
    strategy:
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions_array) }}
    steps:
      - name: Download all artifacts for version ${{ matrix.version }}
        uses: actions/download-artifact@v4
        with:
          pattern: perl-${{ matrix.version }}-*
          path: ./binaries
          merge-multiple: true

      - name: Create GitHub release with all binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ matrix.version }}
          REPO: ${{ github.repository }}
        run: |
          # Derive the platforms actually present from the downloaded tarballs,
          # so a partial build (e.g. a platform skipped for runner availability)
          # produces honest release notes instead of claiming all platforms.
          PLATFORMS_PRESENT=$(ls ./binaries/perl-"$VERSION"-*.tar.gz \
            | sed -E "s#.*perl-$VERSION-##; s#\.tar\.gz\$##" | paste -sd, -)
          NOTES="Pre-built Perl $VERSION binaries. Platforms in this release: $PLATFORMS_PRESENT"

          # Create the release if the tag is new, otherwise add/replace assets on
          # the existing one, so a later run can fill in a platform that was
          # skipped earlier without failing on the existing tag.
          if gh release view "perl-$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "perl-$VERSION" --repo "$REPO" --clobber \
              ./binaries/perl-"$VERSION"-*.tar.gz
          else
            gh release create "perl-$VERSION" \
              --repo "$REPO" \
              --title "Perl $VERSION Binaries" \
              --notes "$NOTES" \
              ./binaries/perl-"$VERSION"-*.tar.gz
          fi

  # Summary job
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [prepare, build, upload]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Perl Versions**: ${{ needs.prepare.outputs.versions }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Upload Status**: ${{ needs.upload.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.build.result }}" == "success" && "${{ needs.upload.result }}" == "success" ]]; then
            echo "✅ All binaries built and uploaded successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some builds or uploads failed - check individual job logs" >> $GITHUB_STEP_SUMMARY
          fi
