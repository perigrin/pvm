Build RFC 0001's "Core-module libraries" and "Call sites" (docs/rfcs/0001-type-libraries.md, both *Decided*): declaration files for the 50 core modules perl 5.42's own library imports most, each held to perl by tests, and `infer` typing a call to any declared sub -- imported or qualified -- from the signatures the parser resolved, selecting among multi candidates at the call site.

Done when issue 01a0fd9b-5700 is done, both RFC sections are re-marked *Implemented*, the committed ranking test passes, and every issue here is done or cancelled with a recorded reason. The resolution command checks the first three; `git zhi verify --timeout 900 core-module-types` checks the last.

## Context

**Declaration files.** `internal/parse/declarations/` is embedded (`//go:embed declarations` in `internal/parse/declarations.go`). `declaration(module)` maps `Foo::Bar` to `declarations/Foo/Bar.tpm`; when one exists the parser reads it *in place of* the module's source (`readDeclaration` -> `readModule` + the typed reader), so a name the file does not declare is a name the import loses. Shipped today: `CORE.tpm` (1,137 lines, the builtins), `Carp.tpm`, `Moose.tpm`, `Moose/Role.tpm`, `Mojolicious/Lite.tpm`, `Future/AsyncAwait.tpm`. A `.tpm` speaks typed Perl: `our @EXPORT`/`@EXPORT_OK` literal lists, `%EXPORT_TAGS` (read by `readExportTags`, exports.go), `sub NAME :prototype(P) (Type $x, ...) Ret;`, `multi sub`, and `None` for a sub that never returns (Carp.tpm's croak/confess). A prototype-only declaration derives its typed signature (RFC "A typed signature and a prototype say the same thing").

**What does not exist yet.** (1) Typed variables: nothing reads `our Hash[Str] %Config :export;` -- no typed `our`, no `:export`/`:export_ok` attribute placing a variable in `@EXPORT`/`@EXPORT_OK`. The rule (perigrin, 2026-10-16): `:export` -> `@EXPORT`, `:export_ok` -> `@EXPORT_OK`, mirroring Exporter's lists; legal only in a `.tpm`, as a typed signature is. (2) A qualified call carries no signatures: `use.go:~318` records the module's own subs in `p.moduleSubs` as `Import{Name, Prototype, PrototypeKnown}` -- no `Signatures` -- so `Carp::confess(...)` resolves via `lookupSub` (shape.go:172) with an empty signature set. (3) `infer` ignores library signatures for typing: `internal/infer/calls.go:26` `call()` takes `parse.CoreBuiltin(name)` only, and an overridden builtin or any user/library sub goes to `userCall`, which never reads `lower.Call.Signatures`. The one consumer today is `exits` (flow.go:~624), which treats a call whose every signature returns `None` as ending its path -- so unqualified `croak`/`confess` are already exits; qualified ones are not. (4) No ranking test, no prototype()/export-list/oracle tests for library `.tpm`s.

**The call-resolution pipeline (perigrin, 2026-10-16: inference takes call resolution from the parser).** `parse.(*parser).markResolution` (arity.go:~139) sets `Node.Override` (a builtin name a sub overrides) and `Node.Signatures` (the declaration's signatures for the sub called, when it is a sub and not the builtin). `internal/lower/call.go:21` copies both onto `lower.Call` (node.go:253-269). `infer` must read `Call.Signatures`/`Override`, never re-resolve names itself.

**Selection.** `internal/types/select.go`: `Select`/`SelectShaped` return `Failed` (no candidate takes the call; no type), a single selection, or `Undecided` (join). `Taking`, `Answering`, `mostSpecific`, `Ambiguity` implement RFC "Multi declarations" and "Context selects by return type". `infer` today uses them only for builtins (`shapedCallReturns`, `builtinReturns`, infer.go:~1000-1045) with unknown argument types. Issue 01a0fd9b-5700 records five known traps a call site must handle (single fitting-arity candidate with mismatched arg types must still select and report `coercion-mismatch`; `UnknownCtx` must join, not fail; void-context `Failed` is untyped, never an error -- `$s =~ s/a/b/g;`; `delete` slice vs element by operand shape; sort's invocant candidate) plus conditions getting scalar context.

**perl is the judge; psc never runs it.** perl 5.42.0 is `/home/perigrin/.local/bin/perl`; privlib (archlib inside it) is `/home/perigrin/.local/share/pvm/versions/5.42.0/lib/perl5/5.42.0`. Tests may run perl; production psc never does (RFC "Rejected alternatives": generating declarations by running perl). The existing runtime oracle is `internal/infer/testdata/observe_types.pl` (maps a live value to its lattice type by membership tests), driven by `TestInferencePrecision` (internal/infer/precision_test.go:135, floor >= 65/76, WRONG = 0). Reuse it for return types rather than writing a second oracle.

**Gates that must hold (m1 + inference).** `TestT2HoldsAll56` / `TestT2CoreParses` (internal/parse/t2_test.go), `TestParseRatchet` (T1), `TestPerlGitTRatchet` (internal/parse/perlgitt_test.go), `TestCanonRatchet`, `TestCanonFidelityRatchet`, `TestRatchet`/`TestRatchetCorpus` (internal/parseoracle), `TestGoParserExactFloor` (exact match), `TestImportResolutionIsWorthT1Files`, `TestInferencePrecision`. A `.tpm` changes what the parser reads for every file that uses the module, so each new declaration can move T1/perl.git/canon -- run those after each batch, not only at the end.

**psc check false positives over lib.** There is no committed baseline today: PR #486's review measured psc check over perl 5.42's lib ad hoc and committed per-root-cause repros (`internal/psc/review_regressions_test.go`, `testdata/review_regressions`). Goal 5 needs a pre-milestone baseline captured *before* the first declaration or call-site change lands, committed, and a test that fails on any diagnostic over lib not in it.

**Conventions.** Every file starts with two `ABOUTME:` lines; `.tpm` comments record what was measured and on which perl/module version (see Carp.tpm). Strict TDD; `make test` green before every commit; never `--no-verify`. CI must pass on Linux, Windows and macOS: a test that needs perl 5.42 or privlib must skip (not fail) where it is absent, and the ranking test must not assume POSIX paths.

