## Design Rationale

**Two chains that meet at the end.** Chain A is call sites: 01a0fd9b-5700 (moved into this milestone, or kept in type-libraries and depended on -- the decomposer decides, but goal 1 requires it done here; its title still says `.pmt` and needs fixing). Chain B is the libraries. They are independent until the end: B's `.tpm` files are parser input and are held to perl by parser-level tests, so they can be written before infer reads them. They meet in the return-type oracle tests and the psc-check-over-lib gate, which need both.

**Critical chain.** baseline capture -> ranking test (fixes the 50) -> typed-variable support -> declarations in batches -> infer reads Call.Signatures (incl. qualified) -> oracle + lib false-positive gate -> RFC re-mark. The baseline must be first: once any declaration lands, "pre-milestone" can no longer be measured.

**The ranking definition must be pinned before any `.tpm` is written.** The RFC reports 128 modules / 1,427 imports. A quick architect scan counting only literal `use Capitalized::Name` lines (excluding the module's own top-level namespace) found 107 modules / 897 imports, with Carp 255, Exporter 79, Scalar::Util 66, File::Spec 54, Config 50, File::Basename 29, Cwd 26, Encode 23, XSLoader 18, Symbol 17 at the head -- so the RFC's count also includes `require`, lowercase pragmas, or something else. The ranking test must state its rule (what counts as an import: `use`, `require`, `use M ()`, `use parent`/`base`; lowercase pragmas in or out; what "own namespace" means for `File::Spec::Unix` vs `File::Spec`) and reproduce the RFC's figure or the RFC must be corrected. In that scan ranks ~41-53 all tie at 2 imports: the 50th place falls inside a tie, so the test needs a deterministic tie-break, recorded in the RFC. Ask perigrin if the RFC's measurement method cannot be recovered.

**Pragmas and infrastructure modules are the risk.** If lowercase pragmas (strict, warnings, constant, vars, overload, parent) rank, a `.tpm` replacing their source could change how the parser handles them; Exporter, XSLoader and DynaLoader the RFC already flags: each is written, then measured against every module that uses it and the m1 gates, and is not shipped (cancelled with the measurement as reason) if it changes resolution. Give each its own issue.

**Batching declarations.** One issue per module is 50 issues of near-identical shape; one issue for all 50 is unverifiable. Batch by shared machinery: pure-Perl exporters with literal lists; XS modules whose prototypes come from `.xs` (List::Util, Scalar::Util, POSIX, Fcntl, Socket -- POSIX alone exports hundreds of names); variable exporters (Config, Getopt::Long, Test::More, Text::Wrap, ExtUtils::MakeMaker, File::stat -- need typed `our`; Errno exports only constants, measured on 5.42.0); OO-only modules with empty export lists (IO::Handle, File::Spec, Class::Struct) whose `.tpm` declares methods but exports nothing. Each batch runs the perl-held tests and the m1 ratchets.

**Held to perl, never run by psc.** Three test kinds per declaration: `prototype(\&M::f)` equals the declared prototype (or both undef); the module's `@EXPORT`/`@EXPORT_OK`/`%EXPORT_TAGS` equal the declaration's; the oracle calls each safe sub in a scratch dir with no network and every observed value must be a member of the declared return type (WRONG = 0). A sub unsafe to call (fork, exec, sockets, file mutation outside scratch, `POSIX::_exit`) is held to prototype and export membership only, and the test lists it explicitly so the exemption is visible.

**Exits.** croak/confess are already `None` in Carp.tpm; the remaining work is the qualified form and any other never-returning sub in the 50 (e.g. `POSIX::_exit`, `Carp::croak` via `Carp::`), each declared `None`.

**Parallelism.** After the ranking test and typed `our`, declaration batches are independent of each other and of chain A. Chain A's sub-steps (Select rulings, Call.Signatures typing, qualified signatures) are sequential.

