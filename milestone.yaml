      The repair split the 49 three ways: 39 deleted as debt, 12 given
      reachable replacements, and 10 kept under a new `pairedNegative`
      exemption on the grounds that a negative in one file plus a
      positive in another is falsifiable as a pair.

      THE GATE MEASURED THE PAIR AND IT DOES NOT HOLD. Delete `"->"`
