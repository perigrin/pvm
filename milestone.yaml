**REBUILT BY `crochet:chain-review` over two rounds, 2026-09-26. Five of
the original seven issues were cancelled -- three on false premises, one as
already owned, one for a title that disagreed with its own body -- and round
2 filed one the restructure had orphaned. Three issues are live, and the
milestone's original thesis was wrong.**

## What this milestone was for, and why that was wrong

It was built to close a 58-point gap between two instruments -- the corpus
at 91.9% (192 of 209 cases) and T2 core at 33.9% (19 of 56 files) -- on the
theory that "the corpus does not contain what T2 fails on".

**That theory is false, and checking it is what the gate was for.**

`conformance/mdtest/argument-extent.md` holds five tier-07 cases on exactly
the largest T2 bucket: a parenless call's argument extent, greedy and
prototype-cut, with the undeclared callee as `parses: no`. Measured, the
arith.t shape adds nothing -- `f 1, 2`, `f 13 % 4, 2` and
`sub tryeq ($$$$) {} tryeq 1, 13 % 4, 1, 'x'` all refuse identically, one
`trailing_tokens` each.

The construct was never missing. Both refusing cases cite
`01a0c432-fbd5`, whose state is `done` -- so a reader follows the citation,
finds finished work, and concludes the corpus is silent. That is what
happened here, and it produced an issue to write coverage that existed.

## What the five cancellations were

- **01a0db76** -- "no corpus case is a parenless call with an argument".
  False, as above. Cancelled.
- **01a0db79-6a25** -- "ten refusals say unfiled". Superseded by a
  fourteen-count version, then cancelled with it.
- **01a0db9f** -- "fourteen of seventeen point at nothing". The count was
  wrong: ten of the fourteen are `unfiled`, which is a DELIBERATE sentinel
  (`file.go:275`, the topic-format spelling of `selfRecorded`) meaning the
  case is its own record. The real number is four, and `01a0d0c7` in `v0.1`
  already owns them.
- **01a0db79-e8f6** -- "nothing rejects `unfiled`". Implementing it would
  require deleting `TestRefusalCitationMustResolve/unfiled_is_not_looked_up`,
  which passes and whose comment rejects the framing in advance: treating
  the sixteen as citations pointing at nothing is "a claim about the corpus
  that is not true".
- **01a0db77** -- superseded by `01a0dba9`, same body with a title that
  matches it. `issue edit` has no `--title`, and a title saying "Four" over
  a body saying three is this milestone's own defect class.

## What survives, and it is not what the milestone was named for

    01a0dba9   Three token facts call a Word an operator, and the
               glossary says the lexer is right
    01a0db78   scanNumber stops early on a signed exponent and never
               forms a vstring
    01a0dbe8   A parenthesised and/or/xor refuses, and the bare form is
               a different program            (found in round 2)

All three are real, all three were found by the corpus, and none is about
T2 coverage. The name `corpus-covers-t2` no longer describes the contents;
it is kept rather than renamed so the record of what was attempted stays
findable.

### Round 2 found the orphan round 1 created

Round 1 moved the `xor` case out of the glossary issue, correctly -- it
also carries `refusal: not_a_term`, so rewriting its token fact would not
make it pass. But nothing then picked it up: the citation issue
(`01a0d0c7`) never mentions it and the issue that would have owned it was
cancelled. `01a0dbe8` is that orphan, measured:

    bare   $a and $b       clean        paren ($a and $b)   UNKNOWN
    bare   $a or  $b       clean        paren ($a or  $b)   UNKNOWN
    bare   $a xor $b       clean        paren ($a xor $b)   UNKNOWN
    paren ($a cmp $b)      clean        paren ($a x 3)      clean
    paren (not $a)         clean

Only the three operators BELOW assignment in precedence fail, and only
inside parens. `cmp` and `x` bind tighter than `=` and are reached by a
different route; `not` is prefix.

The paren is not cosmetic -- perl 5.42.0 reads the two forms as different
programs. `my $y = ($a and $b)` deparses to `my $y = $a && $b`; bare
`my $y = $a and $b` deparses to `$b if my $y = $a`, because `and` binds
looser than `=`. We parse the form that regroups and refuse the one that
does not.

Both halves of the knowledge are already in the parser: `and`/`or`/`xor`
are in the precedence table at levels 4-5 (`precedence.go:59-61`) and
`startsTerm` already knows a word operator is not a term
(`call.go:347`). What fails is reaching them from inside a parenthesised
term.

## The finding worth keeping

Counting by tier hid everything. "07_subroutines 10/13 clean" is three
refusals unnamed, and two of the three were the parenless-call cases that
refuted the milestone's thesis. Naming all seventeen took one test and
found: ten `unfiled` (by design), four citing closed issues (the real
defect, owned by `01a0d0c7`), three citing live issues (correct).

A clean/dirty ratio is not a measurement of what a corpus asserts.

## Gate record

`crochet:chain-review`, 2026-09-26, not backfilled. Both lenses ran
concurrently (alignment, pushback) plus a mechanical AC audit.

Findings that changed the chain:

  - alignment: T2 is 19/56 (33.9%), not the 17/56 (30.4%) the body
    asserted -- a five-day-old figure restated as current.
  - alignment: "four cases have a CLEAN parse" is false for one; the
    `xor` case also carries `refusal: not_a_term`, which is why two
    issues each assumed the other owned it.
  - pushback: `unfiled` is intentional, with a passing test.
  - pushback: 7 of 29 criteria passed vacuously before any work; 1 was
    broken (a negated `grep -c` that passes at counts 1 and 2).
  - chain-review directly: `argument-extent.md` already covers the
    construct.

The AC dry-run could not run as specified: the verify `--dry-run` form
reads only DONE issues, so an all-pending chain yields nothing. The
extraction was reproduced by hand over `milestone show --format json`.

