## Ruling from chain-review round 5 (perigrin, 2026-10-23)

- **`Faithful` forgives exactly three differences, and the set is closed:** call parens, a block's last `;`, and extra paren nesting.
  - TestFaithfulForgivenessIsClosed enumerates them, each with a perl-measured fixture. Any other forgiveness fails the test.
  - Every other spelling difference is recorded in the tree and written back by canon, as `Paren` is. That covers heredoc form, sub-less special subs (`DESTROY {`) and deref braces (`@{$x}` vs `@$x`).
  - A new forgiveness rule needs perigrin's ruling, with its perl measurement. It is never added by an issue.
## Rulings from chain-review round 6 (perigrin, 2026-10-23)

- **The call-parens rule is narrowed.** Today, fidelity.go:62 forgives a canon-added `(` after any word token (`isName`). That lets misgrouped trees pass: `defined($x || $y)` for `defined $x || $y`, `not($x or 1)`, `my($x) = @_` for `my $x = @_`, `local($x) = 1`.
  - The narrowed rule forgives call parens only after list operators and user or method calls, identified by canon's role tags, never by `isName`.
  - It never forgives them after my, our, local, state, named unary ops, `not`, or word infix operators.
  - TestFaithfulForgivenessIsClosed gains perl-judged extent negatives for those five cases.
  - T1 fidelity may drop. It is re-baselined, and every moved file is explained.
- **A paren on an op perl folds away is a known gap, and canon writes it.** Examples: `$h{(1)}`, `-(1)`, `"a" . ("b")`, `($_[0])->[0]`; perl 5.44 keeps no P bit on any of them.
  - psc keeps the source's Paren on that node.
  - The OPf_PARENS check lists the case as a named gap, citing the Concise evidence that perl folded it. It is never a defect.
  - canon writes the paren, so the file is faithful.
- **Convergence:** chain-review runs rounds 7 and 8. If it has not converged at 8, the minute records the non-convergence and the open findings, and perigrin chooses between executing with them as follow-ups and further rounds.
## Ruling from chain-review round 7 (perigrin, 2026-10-23)

- **Canon is precedence-aware, and the call-paren forgiveness rule is removed.**
  - Canon emits named unary ops, `not` and list operators by their precedence, from CORE.tpm's derived shapes and powers.
  - It writes a call's parens only where the source had them (the tree records this in a new `ArgParen` flag) or where binding power requires them.
  - `Faithful` then forgives exactly TWO differences: a block's last `;`, and extra paren nesting.
  - This supersedes the round-5 "exactly three" ruling and the round-6 narrowing of the call-paren rule (A28). A wrong tree's grouping now shows up as a paren the source lacks, by construction, with no forgiveness rule to leak through (A28, A29).
- **Measured for named unary ops** in a scratch worktree at 054e75e6, judged by perl 5.44 (detail: docs/measurements/2026-10-23-precedence-aware-canon/README.md, on branch feat/m3-oracle-at-scale until it merges):

  | | perl.git t/ faithful | M3 dirs faithful |
  |---|---|---|
  | baseline | 342/619 | 178/347 |
  | narrowed `Faithful` alone | 35/619 | 27/347 |
  | precedence-aware canon + narrowed `Faithful` | 342/619, no file moves | 178/347 |

  - At statement level (73,670 statements without heredocs), no statement regressed and 9 improved.
  - The T1 canon, fidelity and parse ratchets moved 0 files.
  - Wrong trees for `defined $x || $y`, `ref $x eq 'A'` and `exists $h{a}` are caught, where the old rule forgave them.
  - Cost: about 11 parser lines and about 42 canon lines.
  - Emit must carry the binding power of the FOLLOWING operator, not only `outer`, so that `!defined $x` and `$a . lc $b` stay bare.
  - 11 existing tests pin the old parenthesised spelling and are updated.
- **Extended to `not` and list ops.** The issue that does this measures it the same way before landing. If list ops lose faithful files, the executor stops and brings perigrin the numbers.
- **Not covered here:** user subs with a `($)` prototype the file cannot see. That is M4 territory, and the test says so.
