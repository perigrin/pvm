The worker probed the parse tree BEFORE touching the lexer, using the
already-one-token `use v5.42.0;` as a control. A cost estimate written into
an issue is a guess until someone checks it, and checking it first turned a
feared refactor into one character.

Verified independently before merging, all three routes and the asymmetry:

    use v5.36;      [Word(use) Quote(v5.36) Semicolon]
    require v5.36;  [Word(require) Quote(v5.36) Semicolon]
    use v5.36.0;    [Word(use) Quote(v5.36.0) Semicolon]
    my $x = 5.36;   [... Number(5.36) ...]    no `v`, still a number
    my $v = v5.36;  [... Quote(v5.36) ...]

And the signatures guard, by neutering `noteSignatures`' Quote branch:

    --- FAIL: TestVStringVersionStillEnablesSignatures
