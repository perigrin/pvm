Close the parser conformance plan's M3 gate (docs/plans/2026-09-05-parser-conformance-plan.md §5, "M3 -- The oracle turns on, at scale"; corpus perl5 `op mro uni lib test_pl`, 347 files). The measurements behind it mostly hold today. They are per-file proxies, scratch tests, or numbers in prose, and this milestone makes each one a committed test that fails in both directions. It builds five things. (1) A per-marker-site oracle ratchet. (2) A parse-without-error floor against the 593 files perl compiles. (3) Canonical re-emission (`Faithful`) run over perl.git t/, with the source parens the tree drops fixed. (4) At least 200 `perf/opcount.t` assertions mined into fixtures held to perl. (5) rv2hv reported exactly where perl emits it, so the rv2hv wider count falls from 389.

Done when every issue here is done or cancelled with perigrin's recorded reason, `git zhi verify --timeout 900 m3-oracle-at-scale` passes, and the resolution command passes. The resolution command checks four things: the plan's M3 section and docs/specs/perl-parser/README.md's Status state the measured numbers, and the stale 584 is gone from the plan; TestParseWithoutErrorOnCompiledCorpus, TestPerlGitTFaithfulOnM3Dirs and TestOpcountFixturesHeldToPerl pass; and TestSiteRatchetCorpus passes over the 620-file sweep. Throughout: WRONG = 0 everywhere; T2 56/56; perl.git t/ 619/619; the T1, canon, fidelity, corpus and exact-match ratchets do not regress; TestInferencePrecision stays >= 65/76; make test passes; and CI is green on the PR, Windows and macOS included. The separate milestone m3-conformance-corpus is NOT part of this one.

