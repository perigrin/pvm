**Rules that bind every issue.**
- Acceptance criteria are named single tests only, one command per line under a heading containing "criteria", with nothing after the criteria block. For example: `go test ./internal/parse/ -run '^TestX$' -count=1 -v | grep -q '^--- PASS: TestX'`. Never `go test ./...`, `make test`, or a whole-package run.
- Verify with `git zhi verify --timeout 900 m3-oracle-at-scale`. Completion is `git zhi milestone edit m3-oracle-at-scale --state complete --timeout 900`.
- Corpus tests need `PERL5_CORPUS=$HOME/dev/perl5`. The oracle sweep also needs `PARSEORACLE_SHIM=$HOME/.cache/pvm/oracleshim`, `PARSEORACLE_TIMEOUT=8m` and the `-parseoracle.corpus` flag (with `-timeout 40m`), and takes about 8-9 minutes.
- perl 5.42 (/home/perigrin/.local/bin/perl) is the judge: measure with perl before deciding semantics, and quote the measurement. Tests may run perl; production psc never does.
- A ratchet fails in both directions; a gain is recorded by re-baselining in the same commit.
- Strict TDD. Run make test before every commit, and never use --no-verify. New files start with two `// ABOUTME:` lines.
- Every change to sites.go or the parser gets a per-fix review against perl. That review also writes NEW adversarial probes outside the existing corpus. In the core-module-types milestone, per-fix reviews that only re-checked the named finding passed regressions the next lens found.

