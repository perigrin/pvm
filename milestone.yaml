## Design Rationale

**Critical chain: site ratchet -> rv2hv -> docs.** TestSiteRatchetCorpus comes first. Condition (7)'s "wider falls from 389, with the new count recorded" is a number that test records: without it, every rv2hv change is judged by a scratch measurement again. The rv2hv work then re-baselines sites.txt, along with baseline.txt where whole files move, in the same commit as each fix. The docs issue comes last, because it states the final measured numbers.

**Re-emission is the bulk of the work, and runs in parallel with that chain.** Start with the ratchet (TestPerlGitTFaithfulRatchet at today's 342/619), so each fix shows up as a gain. **perigrin's ruling (2026-10-22): forgive redundant parens.** Canon keeps writing only the parens binding power implies, as the plan says ("never the parens the source had"). `Faithful` gains a third forgiven difference: a source paren pair that encloses exactly the significant tokens canon wrote for one node, at any nesting (`((x))`), is redundant and is forgiven. A paren pair whose contents do NOT match one node's emission is still a difference, so a misgrouped tree still surfaces; TestCanonCatchesMisgrouping and TestCanonQuotientIsNarrow must stay green, and a new test must show a misgrouping inside a source paren pair (e.g. `print ((1+2)*3)` misread) is still caught. Rejected: canon writing every `Paren` node's parens, which echoes source parens instead of testing them. This should account for most of the 117 dropped-paren failures (e.g. `(shift)->SUPER::foo`, mro/basic_05_c3.t:32; `ok(($y eq ...))`, mro/c3_with_overload.t:40). The T1 canon and fidelity ratchets may move; re-baseline them in the same commit and explain each moved file. The remaining ~52 failures are triaged next. Each is fixed (with a per-fix review against perl), or recorded in faithful_defects.txt with its location. A canon-adds-paren case must be judged against perl (`perl -MO=Deparse,-p` or an op tree) before it is called a misgrouping.

**Independent work.** The opcount mining shares no code with the rest. The parse-without-error floor is one small test, since the number already holds. Both can start immediately.

**Recommended slicing (dependencies in brackets):**
1. Per-site oracle counting: no-answer findings per line, whole-file no-answer at every site (fixture tests). []
2. TestSiteRatchetCorpus + sites.txt + M3-dir >= 80% / WRONG = 0 floor, wired into the CI sweep. [1]
3. TestParseWithoutErrorOnCompiledCorpus at 593. []
4. TestPerlGitTFaithfulRatchet at 342/619. []
5. `Faithful` forgives a redundant source paren pair (perigrin's ruling); prove a misgrouping inside source parens is still caught; re-baseline the T1 and perl.git faithful ratchets. [4]
6. Triage the remaining M3-dir re-emission failures (may split by cause: heredoc tokens, `sub DESTROY`, canon-added parens, `;`/`}`); then TestPerlGitTFaithfulOnM3Dirs + faithful_defects.txt. [5]
7. Mine >= 200 perf/opcount.t assertions; TestOpcountFixturesHeldToPerl. []
8. 01a12059-30a8 (moved here): `->{...}` rv2hv exactly per op_lvalue context. [2]
9. Named-hash rv2hv from declaration (my padhv; our/state/local rv2hv; delete local; slices), hedging only when the declaration is not in the file; a test names each remaining hedge's reason; re-baseline sites.txt below 389 wider. [2; after 8, since both edit sites.go]
10. Docs: plan M3 section (593, measured numbers, `#### Measured at the M3 gate`), ladder summary, README Status (`The M3 gate ...`, stale `($x)` sentence), parseoracle README 584. [2, 3, 6, 7, 9]

Item 9's re-baseline depends on 8 only through sites.go and sites.txt merge order, so the two run in sequence. Items 3, 4->5->6 and 7 run in parallel with 1->2->8->9.

**Budget.** The resolution command runs the ~9-minute sweep inside `--timeout 900`. Keep the other tests it names fast, and do not add a second full sweep to it.
