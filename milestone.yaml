The corpus is green at 91.9% while the parser fails 70% of perl's own T2
core. This milestone closes that gap from the CORPUS side: it adds the
constructs T2 fails on, so one instrument measures what two now measure
separately.

## The measurement, at b0f1a9e9

This parser over all 209 positive corpus cases:

    192 clean, 17 with Unknown          91.9%

    04_operators    29/33      11_oo         16/18
    07_subroutines  10/13      13_opaque      7/15
    the other ten tiers       100%

Against T2 core in the same tree: **17 of 56 files clean, 30.4%.**

Sixty points apart, and the gap is not noise. **The corpus does not
contain what T2 fails on.** Checked: no corpus case is a parenless call
with an argument, which is T2's single largest bucket.

A corpus green at 92% while the parser fails a third of real perl files
has stopped making a claim. The fix is to cover the construct, not to
lower the instrument that noticed.

## The construct, isolated

Declaration form and prototype are IRRELEVANT. Argument count is
everything:

    sub answer { 42 }   print answer, "\n";   clean   <- corpus has this
    sub answer { 42 }   answer;               clean
    sub f { }           f(8);                 clean
    sub f { }           f 8;                  UNKNOWN
    sub f;              f 8;                  UNKNOWN
    sub f ($) { }       f 8;                  UNKNOWN
    sub tryeq ($$$$){}  tryeq 1, 13 % 4, 1;   UNKNOWN  <- arith.t, 179

A parenless call to a DECLARED sub parses with zero arguments and fails
with any. That is why the corpus's own call-form slice passes while
`opbasic/arith.t` carries 179 Unknowns: the slice's four spellings all
call with no arguments, and the one that matters is the fifth.

`%` is not implicated. `sub f {} f 13 % 4` and `sub f {} f 8` fail
identically, so `01a0c10b`'s "`%` read as a hash sigil" reading is a
symptom of argument position, not a modulus bug.

## What perl says, which bounds what the corpus may assert

Measured on 5.42.0. It rules out the obvious fix:

    ok 8;                 SYNTAX ERROR -- "Number found where operator
                          expected (Do you need to predeclare ok?)"
    ok $x, 9;             syntax OK -- $x->ok, '???'
                          INDIRECT OBJECT, not a call
    sub ok {} ok 8, 9;    syntax OK -- a call
    sub f {} f 13 % 4;    syntax OK -- f 1, constant folded

A parser greedily consuming arguments after an UNDECLARED callee builds a
tree for a program perl rejects -- WRONG in the gate's sense, and M1's
gate is Oracle WRONG = 0. So the corpus asserts TWO cases: the declared
one parses, the undeclared one is `parses: no`.

## Sixteen refusals with no issue behind them

Sixteen cases carry `refuses: unfiled`. `refuses:` exists to name an
issue so a refusal points at live work; `unfiled` is the corpus admitting
it does not.

**Measured: ZERO are stale.** All sixteen still refuse. Split by what
actually refuses:

    ten     the parser refuses -- heredocs (3), formats (2),
            pod/data (2), both adjacency bodies, one logical-op case
    six     the parse is CLEAN and a TOKEN FACT fails

A first probe reported six stale and was WRONG, worth recording because
it is this chain's recurring defect in new clothes: it counted Unknown
nodes, while `verdict()` collects refusal codes AND token facts. The
two-way check was working; the probe measuring it was not.

### Four of the six token facts contradict the glossary

`x`, `cmp`, `and`, `xor` are each asserted as `one operator whose text is
"..."`. The lexer emits `Word` and the corpus scores that a refusal. The
glossary, which is the token layer's authority, says:

> **operator** -- Punctuation denoting an operation: `+`, `.`, `=~`, ...
> **word** -- A bare identifier. Keywords are not distinguished from
> other identifiers at this layer.

`x` is not punctuation. By the glossary's own definition the LEXER IS
RIGHT and four corpus facts are wrong. `01a0ce57` independently says the
same in prose while the corpus scores the opposite.

Both layers are individually right and the fact conflated them: perl
emits `repeat` for `$a x 3`, an operator AT THE OP LAYER, while
`categories.go` maps "operator" to `lexer.Operator`, a TOKEN kind. A fact
wanting to say "this spells perl's repeat op" had no vocabulary for it
and reached for the one word in both layers.

That makes this cluster a GLOSSARY decision, not parser work -- and the
glossary is the corpus's contract with B::SoN and Chalk, so it is not a
local fix.

The remaining two are real lexer gaps: `5e-1` lexes as
`Number(5e) Operator(-) Number(1)`, and neither `65.66.67` nor
`v65.66.67` forms a vstring.

## What this milestone does NOT do

- **It does not retire the `t/` ratchet.** Two instruments measuring
  different things is correct; one pretending to measure the other is
  not. `TestT2CoreParses`'s per-file `shortfall` map, which fails in both
  directions, stays.
- **It is not the `t/` sweep.** That is deferred to its own milestone in
  the plan. Extending the corpus is not the sweep; the sweep finds what
  the corpus still lacks AFTER this.
- **It does not touch M2-M6.** M2 lowers the tree this parser builds, so
  it inherits whatever M1's coverage becomes. Nothing in M2's sixteen
  issues reads the corpus and nothing needs to.

