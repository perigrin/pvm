## Design Rationale

**Critical chain: site ratchet -> rv2hv -> docs.** TestSiteRatchetCorpus comes first. Condition (7)'s "wider falls from 389, with the new count recorded" is a number that test records: without it, every rv2hv change is judged by a scratch measurement again. The rv2hv work then re-baselines sites.txt, along with baseline.txt where whole files move, in the same commit as each fix. The docs issue comes last, because it states the final measured numbers.

**Re-emission is the bulk of the work, and runs in parallel with that chain.** Start with the ratchet (TestPerlGitTFaithfulRatchet at today's 342/619), so each fix shows up as a gain. **perigrin's ruling (2026-10-22, revised the same day after measurement): canon writes a `Paren` node's parens once; `Faithful` forgives only extra nesting.** Measured on perl 5.42.0 with B::Concise: where parens change meaning perl builds different ops (`my ($x) = @_` is aassign, `my $x = @_` padsv_store; `($x) x 3` is a list repeat `lK/DOLIST`, `$x x 3` a string repeat; likewise `($x) = f()`, `() = f()`, `local ($x) = 1`). Where they do not, perl builds the same ops in the same context but keeps the paren as one bit, OPf_PARENS (`P`), on the op: `my $z = ($x)` is `padsv sP` vs `padsv s`; `ok(($y eq "x"))` is `seq sKPM` vs `seq sKM`. The bit is boolean: `(($y eq "x"))` and `($y eq "x")` are identical trees. So the parenthesisation perl's tree implies includes one pair wherever perl set the bit: canon writes a `Paren` node's parens once, and `Faithful` gains exactly one forgiven difference, a source paren pair nested directly inside another around the same node. Before any forgiving, the re-emission work classifies the 117 dropped-paren failures by position: one in a context-changing position (before `=`, before `x`, after `my`/`our`/`local`/`state`) is a tree defect (psc read a list as a scalar) and is fixed, not forgiven. An oracle check compares perl's OPf_PARENS bit with psc's `Paren` flag op by op, so that whether psc attached each paren to the right node is judged by perl; it is an issue in this milestone. TestCanonCatchesMisgrouping must stay green. This supersedes the earlier same-day ruling to forgive redundant parens in `Faithful`. The T1 canon and fidelity ratchets may move; re-baseline them in the same commit and explain each moved file. The remaining ~52 failures are triaged next, each fixed (with a per-fix review against perl) or listed in faithful_queue.txt until fixed (round-4 ruling: the queue is empty at close; nothing is parked). A canon-adds-paren case is judged against perl (`perl -MO=Deparse,-p` or an op tree) before it is called a misgrouping.

**Independent work.** The opcount mining shares no code with the rest. The parse-without-error floor is one small test, since the number already holds. Both can start immediately.

