### One process mistake of mine

The first PAAD gate was dispatched WITHOUT worktree isolation, and its
mutation testing appeared in the orchestrator's working tree, nearly
sweeping into an unrelated commit. The skill warns about exactly this and I
had applied it to the two execution workers and not to the reviewer,
because I read "review" as read-only -- while explicitly instructing it to
mutate. The remaining three gates ran isolated.

